name: BendMobile
options:
  bundleIdPrefix: dev.bendmobile
  deploymentTarget:
    iOS: "16.0"
targets:
  BendMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - ../native/cpu.cpp
      - ../native/generated/kernel.metal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bendmobile.counter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/BendMobile-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
  BendMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/CounterTests.swift]
    dependencies:
      - target: BendMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BendMobileComputeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/ComputeTests.swift]
    dependencies:
      - target: BendMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BendMobile:
    build:
      targets:
        BendMobile: all
    test:
      targets: [BendMobileUITests, BendMobileComputeTests]
